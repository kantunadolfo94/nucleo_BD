<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SneakShop | Encuentra tu estilo en cada paso</title>
  <meta name="description" content="SneakShop: tienda de calzado deportivo, casual y de vestir. Presentación y categorías." />
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- ==================== ENCABEZADO ==================== -->
  <header class="encabezado" id="encabezado">
    <a class="logo" href="#inicio">
      <img src="/images/logo.svg" alt="Logotipo SneakShop" class="logo__img" />
      <span class="logo__texto">SNEAK<em>SHOP</em></span>
    </a>

    <nav class="menu" id="menu" aria-label="Menú principal">
      <a href="#inicio">Inicio</a>
      <a href="#categorias">Categorías</a>
    </nav>

    <button class="menu-boton" id="menu-boton" aria-label="Abrir menú" aria-expanded="false">☰</button>
  </header>

  <main>
    <!-- ==================== HERO / PRESENTACIÓN ==================== -->
    <section class="hero" id="inicio">
      <div class="hero__brillo hero__brillo--uno"></div>
      <div class="hero__brillo hero__brillo--dos"></div>

      <div class="hero__contenido">
        <p class="hero__etiqueta"><span class="hero__fuego">👟</span> COLECCIÓN 2026</p>
        <h1>Encuentra tu estilo <span class="hero__grad">en cada paso</span></h1>
        <p class="hero__texto">
          Deportivos, casuales, de vestir y botas. El calzado que tu estilo necesita,
          en un solo lugar.
        </p>
        <div class="hero__acciones">
          <a class="boton boton--neon" href="#categorias">Ver categorías →</a>
        </div>
      </div>

      <div class="hero__imagen">
        <img src="/images/hero.svg" alt="Ilustración de tenis SneakShop" />
      </div>
    </section>

    <!-- ==================== CATEGORÍAS ==================== -->
    <section class="seccion seccion--alterna" id="categorias">
      <div class="seccion__cabecera">
        <p class="seccion__kicker">ELIGE TU TERRENO</p>
        <h2>Categorías</h2>
        <p class="seccion__sub">Cuatro estilos, un solo lugar — haz clic en una</p>
      </div>

      <div class="cuadricula categorias">
        <button class="tarjeta-categoria" type="button" data-categoria="Deportivos">
          <img src="/images/categoria-deportivos.svg" alt="Categoría deportivos" />
          <h3>Deportivos</h3>
          <p>Rendimiento y comodidad para entrenar.</p>
        </button>

        <button class="tarjeta-categoria" type="button" data-categoria="Casuales">
          <img src="/images/categoria-casuales.svg" alt="Categoría casuales" />
          <h3>Casuales</h3>
          <p>Estilo relajado para tu día a día.</p>
        </button>

        <button class="tarjeta-categoria" type="button" data-categoria="De vestir">
          <img src="/images/categoria-vestir.svg" alt="Categoría de vestir" />
          <h3>De vestir</h3>
          <p>Elegancia para tus eventos especiales.</p>
        </button>

        <button class="tarjeta-categoria" type="button" data-categoria="Botas">
          <img src="/images/categoria-botas.svg" alt="Categoría botas" />
          <h3>Botas</h3>
          <p>Resistencia y actitud en cada terreno.</p>
        </button>
      </div>
    </section>
  </main>

  <!-- ==================== MODAL DE CATEGORÍA ==================== -->
  <div class="modal" id="modal-categoria" aria-hidden="true">
    <div class="modal__contenido">
      <button class="modal__cerrar" id="modal-cerrar" aria-label="Cerrar">✕</button>
      <div class="modal__cuerpo" id="modal-cuerpo">
        <p class="cargando">Cargando…</p>
      </div>
    </div>
  </div>

  <script src="/js/app.js" defer></script>
</body>
</html>
